name: Daily Cat Update

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run cat script
        run: node update-cat.js

      - name: Commit and push changes
        run: |
          git add cat-of-the-day/index.html
          git commit -m "Update Cat of the Day" || echo "No changes to commit"
          git push
